name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, scan and ship to droplet
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build backend image
        run: docker build -t gloria-backend:latest backend

      - name: Build web image
        run: docker build -t gloria-web:latest frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gloria-backend:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gloria-web:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Strip CRs (Windows paste) and guarantee a trailing newline —
          # OpenSSH rejects the key with 'error in libcrypto' otherwise.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY secret is not a valid private key. Paste the FULL private key file (including the BEGIN/END lines), e.g. ~/.ssh/id_ed25519 — not the .pub file."
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ship images to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          docker save gloria-backend:latest gloria-web:latest
          | gzip
          | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'gunzip | docker load'

      - name: Ship config and environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/nginx.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/gloria/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077 && printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' '$DB_PASSWORD' '$JWT_SECRET' > /opt/gloria/.env"

      - name: Restart stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/gloria && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"

      - name: Verify deployment
        run: |
          sleep 20
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            https://ssc-gameproject.dranon-todolist.me/api/health
