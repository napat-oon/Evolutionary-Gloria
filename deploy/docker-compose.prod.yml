# Production stack on the droplet. Lives at /opt/gloria/docker-compose.prod.yml;
# the deploy workflow ships images over SSH and re-ups this file.
# Requires /opt/gloria/.env with DB_PASSWORD and JWT_SECRET.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gloria
      POSTGRES_USER: gloria
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloria -d gloria"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: gloria-backend:latest
    restart: unless-stopped
    # Small-droplet sizing: bound the JVM so the kernel OOM killer does not
    # cut it down mid-startup (Spring's context refresh is the memory peak).
    mem_limit: 512m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: gloria-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend

volumes:
  pgdata:
  certbot-webroot:
