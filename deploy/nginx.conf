server {
    listen 80;
    server_name ssc-gameproject.dranon-todolist.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssc-gameproject.dranon-todolist.me;

    ssl_certificate /etc/letsencrypt/live/ssc-gameproject.dranon-todolist.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssc-gameproject.dranon-todolist.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: the backend rate limiter trusts this header,
        # and nginx is the only edge, so client-supplied values must be dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Immutable hashed assets can be cached hard; index.html must not be.
    # nginx add_header in a location discards server-level headers, so the
    # security headers are repeated here.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
