spring:
  application:
    name: evolutionary-gloria
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gloria}
    username: ${POSTGRES_USER:gloria}
    password: ${POSTGRES_PASSWORD:gloria}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

gloria:
  jwt:
    # Override JWT_SECRET in every real environment; must be at least 32 bytes.
    secret: ${JWT_SECRET:local-dev-only-secret-0123456789abcdefghijklmnop}
    access-ttl: 30m
    refresh-ttl: 7d
    secure-cookies: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
